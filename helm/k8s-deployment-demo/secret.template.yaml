# Copy this file to secret.yaml, replace the placeholder values with real ones,
# then: kubectl apply -f helm/k8s-deployment-demo/secret.yaml
#
# secret.yaml is git-ignored — never commit real secret values.
# This Secret is intentionally NOT managed by the Helm chart itself — see
# the "Design decisions" section of the README for why.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app.kubernetes.io/name: app-secret
    app.kubernetes.io/instance: k8s-deployment-demo
    app.kubernetes.io/part-of: k8s-deployment-demo
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"